name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dsh's schema validator
        run: npm install --no-save --no-audit --no-fund @deepseek-ai/dsh-tools@0.2.1-rc.2
      - name: Plugin tests
        run: node --check index.js && npm test

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install harness2-dsh with Harness2
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv -e .
      - name: Adapter and CLI tests
        run: .venv/bin/python -m unittest discover -s tests -v
